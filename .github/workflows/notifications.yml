name: Notifications

on:
  workflow_run:
    workflows: ["AutoDevHarness CI", "Deploy"]
    types: [completed]

jobs:
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Success Notification
        run: |
          echo "✓ Workflow completed successfully"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Run: ${{ github.event.workflow_run.name }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    
    steps:
      - name: Get workflow run info
        run: |
          echo "✗ Workflow failed"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Run: ${{ github.event.workflow_run.name }}"
          echo "Run URL: ${{ github.event.workflow_run.html_url }}"
      
      - name: Notify Slack
        if: secrets.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":x: AutoDevHarness failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*AutoDevHarness CI Failed*\nBranch: ${{ github.event.workflow_run.head_branch }}\nRun: ${{ github.event.workflow_run.name }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      
      - name: Notify DingTalk
        if: secrets.DINGTALK_WEBHOOK != ''
        run: |
          curl -s -X POST '${{ secrets.DINGTALK_WEBHOOK }}' \
            -H 'Content-Type: application/json' \
            -d '{"msgtype": "text", "text": {"content": "AutoDevHarness Failed: ${{ github.event.workflow_run.head_branch }}"}}'
        continue-on-error: true

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Deploy'
    
    steps:
      - name: Get deployment info
        run: |
          echo "✓ Deployment completed"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
