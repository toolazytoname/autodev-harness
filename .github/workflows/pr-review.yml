name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run AI Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR info
          PR_NUMBER=$(echo ${{ github.event.pull_request.number }})
          REPO=${{ github.repository }}
          
          # Run code review
          ./autodev-harness/scripts/code-review.sh staged | tee review.md
          
          # Post comment
          gh pr comment $PR_NUMBER --body-file review.md || true
      
      - name: Security Scan
        run: |
          ./autodev-harness/scripts/security-review.sh | tee security-report.md
      
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md

  quality-check:
    name: Quality Gates
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Quality Gates
        run: |
          ./autodev-harness/scripts/run-quality-gates.sh critical

  approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    needs: [code-review, quality-check]
    
    steps:
      - name: Check if ready
        run: |
          echo "✓ All checks passed"
          echo "PR is ready for human review"
