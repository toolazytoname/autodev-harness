name: AutoDevHarness CI

on:
  push:
    branches: [main, develop]
  schedule:
    # Run daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - plan
          - build
          - evaluate
          - status

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  autodev:
    name: AutoDevHarness
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Claude
        run: |
          npm install -g @anthropic-ai/claude-code
      
      - name: Run AutoDevHarness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ github.event.inputs.command || 'full' }}" in
            full)
              ./autodev-harness/scripts/autodev-harness.sh --continue
              ;;
            plan)
              ./autodev-harness/scripts/autodev-harness.sh --skip-gan --skip-build
              ;;
            build)
              ./autodev-harness/scripts/task-queue-engine.sh run
              ;;
            evaluate)
              ./autodev-harness/scripts/gan-loop.sh
              ;;
            status)
              ./autodev-harness/scripts/dashboard.sh
              ;;
          esac
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autodev-artifacts
          path: |
            autodev-harness/feedback/
            autodev-harness/state/
            autodev-harness/logs/

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: autodev
    if: always()
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: autodev-artifacts
          path: artifacts/
      
      - name: Generate Summary
        run: |
          echo "# AutoDevHarness Report" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f artifacts/feedback/gan/summary.json ]; then
            echo "## GAN Evaluation" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat artifacts/feedback/gan/summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f artifacts/state/task-queue.json ]; then
            echo "## Task Progress" >> $GITHUB_STEP_SUMMARY
            jq '.progress' artifacts/state/task-queue.json >> $GITHUB_STEP_SUMMARY
          fi
          
          cat $GITHUB_STEP_SUMMARY
