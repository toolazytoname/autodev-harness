# AutoDevHarness v2 — Model Routing Table
# Per MASTER-PLAN §4
#
# Resolution order (first hit wins):
#   1. ``AUTODEV_MODEL_<TIER>`` env var             — explicit pin
#   2. ``model`` field in this YAML                — YAML default
#   3. claude CLI's own default (no ``--model``)   — defer to user's
#      ``~/.claude/settings.json`` (ANTHROPIC_MODEL) or whatever CLI is
#      configured
#
# For #3 to actually kick in, the YAML ``model`` field below must be
# the literal string ``"cli-default"``. When the router sees that
# sentinel, the adapter calls the CLI WITHOUT ``--model`` and the user
# keeps full control via their own settings.json.
#
# Why "cli-default" instead of pinning "sonnet" / "opus" / "haiku":
# those CLI role aliases are Claude-specific — they don't translate to
# other CLIs (codex, gemini-cli, etc.). Pinning them in YAML couples
# harness to one CLI vendor and breaks the moment a user swaps
# providers. Letting the CLI pick its own default keeps the harness
# vendor-neutral.
#
# Environment-variable overrides (take precedence over this file):
#   AUTODEV_MODEL_<TIER>   = e.g. "sonnet" or "claude-opus-4-8"
#   AUTODEV_BASE_URL_<TIER> = e.g. "https://api.example.com/v1"
#   AUTODEV_FALLBACK_<TIER> = same scheme as MODEL — ``cli-default`` is
#                             allowed here too

tiers:
  # architect: defer to CLI default — user controls via their own config
  architect:
    model: cli-default
    fallback: cli-default
    # T29: absolute per-tier token cap. warn_at/stop_at percent below
    # are computed against this number. Tune via AUTODEV_BUDGET_ARCHITECT
    # env var if a single project needs a different cap.
    max_tokens: 2000000

  # reviewer: defer to CLI default
  reviewer:
    model: cli-default
    fallback: cli-default
    max_tokens: 5000000

  # worker: defer to CLI default — same model for generate + fallback.
  # If you want different models per tier, set AUTODEV_MODEL_<TIER>
  # at process start (no YAML edit needed).
  worker:
    model: cli-default
    fallback: cli-default
    max_tokens: 10000000

# Budget thresholds per tier (MASTER-PLAN §5.7, wired in T29).
# ``max_tokens`` (above) is the absolute cap per tier;
# ``warn_at_percent`` / ``stop_at_percent`` are the percent-of-cap
# trigger points. When a tier's accumulated spend crosses
# ``stop_at_percent`` of its cap, the next call to
# ``router.check_budget(stage)`` raises ``BudgetExceeded`` and the
# pipeline refuses to dispatch a new model call for that stage.
budget:
  warn_at_percent: 80
  stop_at_percent: 100

# Stage → tier assignments
assignments:
  research:        worker
  plan:            architect
  ui_design:       reviewer
  taskgen:         worker
  generate:        worker
  review.correctness: reviewer
  review.test:     worker      # 跑命令为主，判断为辅
  review.boundary: reviewer
  review.security: reviewer
  review.visual:   reviewer
  review.a11y:     worker
  escalation:      architect   # gate 撞顶仲裁
  final_acceptance: architect