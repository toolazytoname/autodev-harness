# AutoDevHarness v2 — Reviewer Configuration
# Per MASTER-PLAN §2 + T05 spec
#
# Maps task `kind` to a list of reviewer identifiers.
# The inner loop runs all assigned reviewers in parallel.
# Each reviewer corresponds to agents/reviewers/{name}.md.

# Default reviewer set for all task kinds
default: &default
  - correctness
  - test
  - boundary

# Task kinds → reviewer combinations
# logic:  core business logic — correctness + test + boundary is sufficient
# api:    adds security reviewer
# ui:     adds a11y + visual reviewers
# infra:  adds security reviewer
reviewers:
  logic:
    - correctness
    - test
    - boundary

  api:
    - correctness
    - test
    - boundary
    - security

  ui:
    - correctness
    - test
    - boundary
    - a11y
    - visual

  infra:
    - correctness
    - test
    - boundary
    - security

# Per-reviewer overrides (optional)
# Allows disabling or reordering reviewers per task kind
overrides: {}
