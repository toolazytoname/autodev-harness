[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodev-harness"
version = "0.1.0"
description = "AI-driven development harness with independent quality loops"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that call real models / real CLIs (deselect with '-m \"not slow\"')",
]

[tool.hatch.build.targets.wheel]
packages = ["harness"]
